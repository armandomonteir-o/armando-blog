name: Bug
description: Algo não funciona como deveria
title: "fix: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes, veja `docs/pitfalls/README.md`: a resposta pode já estar lá.
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: O que acontece e o que deveria acontecer.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidência
      description: Arquivo e linha, saída de comando, rota e passos para reproduzir.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: O que fazer
      description: A correção proposta, se já houver uma.
  - type: textarea
    id: done
    attributes:
      label: Pronto quando
      value: |
        - [ ] Teste que reproduz o bug, vermelho antes da correção
        - [ ] Rota verificada rodando
    validations:
      required: true
