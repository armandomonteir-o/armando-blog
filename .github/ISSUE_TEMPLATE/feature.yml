name: Feature
description: Funcionalidade nova ou mudança de comportamento
title: "feat: "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrir, veja as [milestones](../../milestones) e as issues abertas: pode já estar planejado.
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Que problema isso resolve e por que agora.
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: O que fazer
      description: A proposta. Se houver decisão em aberto, liste as opções com prós e contras.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Pronto quando
      value: |
        - [ ] Critério 1
        - [ ] Critério 2
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Referências
      description: Docs, ADRs, prints do protótipo.
