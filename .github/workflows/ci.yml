name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: type-check · lint · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (production dependencies)
        # Fails on a "high" or "critical" advisory in what ships to production (#127).
        run: npm audit --omit=dev --audit-level=high

      - name: Audit (development dependencies, warning only)
        # Dev tooling does not ship, so it warns instead of blocking everyone (#127).
        run: npm audit --audit-level=high || echo "::warning title=npm audit::development dependencies have high or critical advisories (see the log)"

      - name: Type check
        run: npx tsc --noEmit

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build fetches posts from WordPress on purpose (#66): no placeholder fallback.
          WORDPRESS_API_URL: ${{ vars.WORDPRESS_API_URL }}
